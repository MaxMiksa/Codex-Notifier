<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Codex-Notifier i18n Preview</title>
  <style>
    :root {
      --bg: #f3f6f9;
      --panel: #ffffff;
      --text: #1f2937;
      --muted: #4b5563;
      --accent: #0f766e;
      --border: #d1d5db;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", "Noto Sans", sans-serif;
      background: linear-gradient(135deg, #e5edf3 0%, #f7fafc 100%);
      color: var(--text);
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .app {
      width: min(100%, 920px);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 20px 35px rgba(15, 23, 42, 0.08);
      padding: 20px;
      box-sizing: border-box;
      display: grid;
      gap: 20px;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
    }
    label {
      font-size: 14px;
      color: var(--muted);
      display: inline-flex;
      gap: 8px;
      align-items: center;
    }
    select {
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px 10px;
      background: #fff;
      color: var(--text);
    }
    .card {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding-block: 14px;
      padding-inline: 14px;
      display: grid;
      gap: 10px;
      overflow-wrap: anywhere;
    }
    .title {
      font-size: clamp(18px, 2vw, 24px);
      font-weight: 700;
      color: var(--accent);
      margin: 0;
    }
    .body {
      margin: 0;
      color: var(--text);
      line-height: 1.5;
    }
    .legal {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.5;
    }
    .meta {
      color: var(--muted);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="controls">
      <label>Locale
        <select id="locale">
          <option value="en-US">en-US</option>
          <option value="zh-CN">zh-CN</option>
          <option value="ar-XB">ar-XB (pseudo RTL)</option>
        </select>
      </label>
      <label>Direction
        <select id="dir">
          <option value="auto">auto</option>
          <option value="ltr">ltr</option>
          <option value="rtl">rtl</option>
        </select>
      </label>
    </div>

    <section class="card">
      <h1 class="title" id="title"></h1>
      <p class="body" id="body"></p>
      <p class="legal" id="legal"></p>
      <p class="meta" id="meta"></p>
    </section>
  </main>

  <script>
    const MESSAGES = {
      "en-US": {
        dir: "ltr",
        title: "Codex has completed the current task",
        body: "Click notification to jump back to your workspace. Completed at 04:15:48.",
        legal: "Privacy notice: notifications are generated from local runtime events."
      },
      "zh-CN": {
        dir: "ltr",
        title: "Codex 已完成当前任务",
        body: "点击通知可快速返回当前工作区。完成时间 04:15:48。",
        legal: "隐私说明：通知仅基于本地运行事件生成。"
      },
      "ar-XB": {
        dir: "rtl",
        title: "⟪RTL⟫ Codex completed the current task",
        body: "⟪RTL⟫ Click notification to focus workspace. Completed at 04:15:48.",
        legal: "⟪RTL⟫ Privacy notice: local runtime events only."
      }
    };

    const localeEl = document.getElementById("locale");
    const dirEl = document.getElementById("dir");
    const titleEl = document.getElementById("title");
    const bodyEl = document.getElementById("body");
    const legalEl = document.getElementById("legal");
    const metaEl = document.getElementById("meta");

    function render() {
      const locale = localeEl.value;
      const data = MESSAGES[locale] || MESSAGES["en-US"];
      const requestedDir = dirEl.value;
      const effectiveDir = requestedDir === "auto" ? data.dir : requestedDir;

      document.documentElement.lang = locale;
      document.documentElement.dir = effectiveDir;

      titleEl.textContent = data.title;
      bodyEl.textContent = data.body;
      legalEl.textContent = data.legal;
      metaEl.textContent = `locale=${locale}, dir=${effectiveDir}`;
    }

    localeEl.addEventListener("change", render);
    dirEl.addEventListener("change", render);
    render();
  </script>
</body>
</html>
